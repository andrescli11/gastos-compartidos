name: Bootstrap dependency lock
on:
  push:
    branches: [feat/foundations-money]
    paths:
      - .github/workflows/bootstrap.yml
      - package.json
permissions:
  contents: read
concurrency:
  group: bootstrap-dependency-lock
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'andrescli11/gastos-compartidos' && github.ref == 'refs/heads/feat/foundations-money'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check whether bootstrap is needed
        id: lock
        shell: bash
        run: |
          if test -f package-lock.json; then
            echo 'missing=false' >> "$GITHUB_OUTPUT"
          else
            echo 'missing=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.lock.outputs.missing == 'true'
        with:
          node-version: 24
      - name: Resolve dependencies without lifecycle scripts
        if: steps.lock.outputs.missing == 'true'
        run: npm install --ignore-scripts
      - name: Pin direct dependencies to resolved versions
        if: steps.lock.outputs.missing == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          for (const section of ['dependencies', 'devDependencies']) {
            for (const name of Object.keys(manifest[section] ?? {})) {
              const version = lock.packages[`node_modules/${name}`]?.version;
              if (!version || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
                throw new Error(`Missing exact version for ${name}`);
              }
              manifest[section][name] = version;
            }
          }
          writeFileSync('package.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Normalize tracked source formatting
        if: steps.lock.outputs.missing == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const changed = execFileSync('git', ['diff', '--name-only', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          if (changed.some(path => path !== 'package.json')) {
            throw new Error('Unexpected tracked changes before formatting');
          }
          NODE
          npm run format
      - name: Commit dependency lock and tracked formatting changes
        if: steps.lock.outputs.missing == 'true'
        env:
          BOOTSTRAP_TOKEN: ${{ github.token }}
          BOOTSTRAP_REPOSITORY: ${{ github.repository }}
          BOOTSTRAP_EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { lstatSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const repository = process.env.BOOTSTRAP_REPOSITORY;
          const expected = process.env.BOOTSTRAP_EXPECTED_SHA;
          const branch = 'feat/foundations-money';
          if (repository !== 'andrescli11/gastos-compartidos') throw new Error('Unexpected repository');
          const gitPaths = args => execFileSync('git', args, { encoding: 'utf8' }).split('\0').filter(Boolean);
          const modified = gitPaths(['diff', '--name-only', '--diff-filter=M', '-z']);
          const changed = gitPaths(['diff', '--name-only', '-z']);
          if (changed.length !== modified.length) throw new Error('Only modifications of existing tracked files are allowed');
          const tracked = new Map(gitPaths(['ls-files', '--stage', '-z']).map(entry => {
            const [metadata, path] = entry.split('\t');
            return [path, metadata.split(' ')[0]];
          }));
          const paths = [...new Set([...modified, 'package-lock.json'])];
          const entries = paths.map(path => {
            const parts = path.split('/');
            if (path.startsWith('/') || path.includes('\\') || parts.some(part =>
              !part || part === '.' || part === '..' || (part.startsWith('.env') && part !== '.env.example')
            )) throw new Error('Unsafe path in bootstrap changes');
            for (let index = 1; index <= parts.length; index++) {
              if (lstatSync(parts.slice(0, index).join('/')).isSymbolicLink()) throw new Error('Symlinks are not allowed');
            }
            const mode = path === 'package-lock.json' ? '100644' : tracked.get(path);
            if (!['100644', '100755'].includes(mode) || !lstatSync(path).isFile()) {
              throw new Error('Only regular tracked files and the new lockfile may be committed');
            }
            return { path, mode, type: 'blob', content: readFileSync(path, 'utf8') };
          });
          async function api(path, method = 'GET', body) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${process.env.BOOTSTRAP_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            if (!response.ok) throw new Error(`GitHub API request failed (${response.status})`);
            return response.json();
          }
          const head = await api(`git/ref/heads/${branch}`);
          if (head.object.sha !== expected) throw new Error('Branch advanced; refusing stale lockfile commit');
          const parent = await api(`git/commits/${expected}`);
          const tree = await api('git/trees', 'POST', {
            base_tree: parent.tree.sha,
            tree: entries,
          });
          const commit = await api('git/commits', 'POST', {
            message: 'build: pin dependencies and normalize source formatting',
            tree: tree.sha,
            parents: [expected],
          });
          const latest = await api(`git/ref/heads/${branch}`);
          if (latest.object.sha !== expected) throw new Error('Branch advanced; refusing stale lockfile commit');
          await api(`git/refs/heads/${branch}`, 'PATCH', { sha: commit.sha, force: false });
          console.log(`Committed dependency lockfile: ${commit.sha}`);
          NODE
      # GITHUB_TOKEN commits do not trigger another push workflow. Validate here too.
      - if: steps.lock.outputs.missing == 'true'
        run: npm ci
      - if: steps.lock.outputs.missing == 'true'
        run: npm run format:check
      - if: steps.lock.outputs.missing == 'true'
        run: npm run lint
      - if: steps.lock.outputs.missing == 'true'
        run: npm run typecheck
      - if: steps.lock.outputs.missing == 'true'
        run: npm test
      - if: steps.lock.outputs.missing == 'true'
        run: npm run build
      - if: steps.lock.outputs.missing == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.lock.outputs.missing == 'true'
        run: npx playwright test
      - if: steps.lock.outputs.missing == 'true'
        run: npm audit --audit-level=high
