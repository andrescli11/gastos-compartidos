name: Database
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-fixture-only
          POSTGRES_DB: cusco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-ci-fixture-only
      PGDATABASE: cusco_test
      CUSCO_DB_TEST_DISPOSABLE: "yes"
      DATABASE_URL: postgresql://postgres:local-ci-fixture-only@127.0.0.1:5432/cusco_test
      APP_URL: http://127.0.0.1:3000
      RATE_LIMIT_SECRET: disposable-ci-http-quota-fixture-only-00000000
      PIN_SECRET: disposable-ci-pin-pepper-fixture-only-000000000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/test-db.sh
      - run: bash scripts/check-backup-restore.sh
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify real HTTP and database flow
        shell: bash
        run: |
          npm run start > /tmp/cusco-http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          let ready = false;
          const deadline = Date.now() + 30000;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(`${process.env.APP_URL}/entrar`, {
                signal: AbortSignal.timeout(1000),
              });
              if (response.ok) { ready = true; break; }
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 250));
          }
          if (!ready) {
            console.error("HTTP server readiness failed (details withheld).");
            process.exitCode = 1;
          }
          NODE
          node scripts/check-http-flow.mjs
          node scripts/check-browser-flow.mjs

      - name: Check out the prior production release for rollback compatibility
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2c8caa7c8edb128e50e81275ae722cabff0c8e7d
          path: .rollback-source
          persist-credentials: false
      - name: Build prior application against the migrated database
        working-directory: .rollback-source
        run: |
          npm ci
          npm run build
      - name: Rehearse application rollback without reverting the database
        env:
          PORT: 3002
          APP_URL: http://127.0.0.1:3002
        shell: bash
        run: |
          npm run start --prefix .rollback-source > /tmp/cusco-rollback-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          let ready = false;
          const deadline = Date.now() + 30000;
          while (Date.now() < deadline) {
            try {
              const r = await fetch(`${process.env.APP_URL}/entrar`, { signal: AbortSignal.timeout(1000) });
              if (r.ok) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 250));
          }
          if (!ready) process.exitCode = 1;
          NODE
          node scripts/check-http-flow.mjs
